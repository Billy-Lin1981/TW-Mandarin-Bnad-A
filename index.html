  h+='<details class="card exp"'+(u===q.ans?'':' open')+'><summary>'+(k+1)+'. '+st+'　'+esc(q.stem.split("\n")[0].slice(0,22))+'</summary><p class="stem" style="font-size:16px">'+esc(q.stem)+'</p><p>あなたの答え：'+(u<0?'未回答':'('+"ABCD"[u]+') '+esc(q.opts[u]))+'<br>正解：('+"ABCD"[q.ans]+') '+esc(q.opts[q.ans])+'</p><h3>なぜ正しいか</h3><p>'+esc(q.why)+'</p><h3>他の選択肢</h3><p>'+esc(q.wrong)+'</p><h3>ポイント</h3><p>'+esc(q.point)+'</p><p class="meta" style="margin-top:8px">分野：'+esc(q.tags.join("・"))+'（Level '+(q.lv||1)+'）</p></details>';
 });
 h+='<button class="btn" id="bk">ホームへ</button>';
 app.innerHTML=h;window.scrollTo(0,0);
 document.getElementById("bk").onclick=home;
}
home();
</script>
